  <text x="775" y="157" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">WHY</text>
  <line x1="54" y1="174" x2="1144" y2="174" stroke="#293044"/>

  <text x="54" y="215" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">10:02</text>
  <text x="185" y="215" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">turn_token_usage</text>
  <text x="390" y="215" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14">420,000</text>
  <text x="585" y="215" fill="#34d399" font-family="Arial, sans-serif" font-size="14">420,000</text>
  <text x="775" y="215" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">first cumulative observation</text>

  <rect x="46" y="240" width="1100" height="60" rx="10" fill="#181926"/>
  <text x="54" y="276" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">10:08</text>
  <text x="185" y="276" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">turn_token_usage</text>
  <text x="390" y="276" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14">690,000</text>
  <text x="585" y="276" fill="#34d399" font-family="Arial, sans-serif" font-size="14">270,000</text>
  <text x="775" y="276" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14">delta, not 690,000 again</text>

