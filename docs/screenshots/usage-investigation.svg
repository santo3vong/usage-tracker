  <text x="390" y="398" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14">310,000</text>
  <text x="585" y="398" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14">route-level</text>
  <text x="775" y="398" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">not credited to one model</text>

  <text x="54" y="459" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">10:26</text>
