  <text x="775" y="459" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">never silently converted to $0</text>

  <rect x="54" y="502" width="1090" height="66" rx="12" fill="#0f172a"/>
  <text x="76" y="530" fill="#818cf8" font-family="Arial, sans-serif" font-size="14" font-weight="700">Investigation note</text>
  <text x="76" y="553" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">Preserve provenance first; compare local time, UTC and rolling-window boundaries before “fixing” a mismatch.</text>
  <text x="54" y="624" fill="#64748b" font-family="Arial, sans-serif" font-size="12">All names and values in this image are synthetic.</text>
