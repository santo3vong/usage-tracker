  <text x="390" y="337" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14">185,000</text>
  <text x="585" y="337" fill="#34d399" font-family="Arial, sans-serif" font-size="14">185,000</text>
  <text x="775" y="337" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">direct per-response record</text>

  <rect x="46" y="362" width="1100" height="60" rx="10" fill="#181926"/>
  <text x="54" y="398" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">10:18</text>
