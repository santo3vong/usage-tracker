  <text x="60" y="79" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Why “just add the numbers” can be wrong · synthetic demo data</text>

  <rect x="28" y="120" width="1144" height="474" rx="18" fill="#12131c"/>
  <text x="54" y="157" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">TIME</text>
